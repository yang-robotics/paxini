# PXCap III 采集配置。存在即加载；命令行参数永远优先于本文件。
# 逐字段的详细说明与取值范围见 Cap_Quest/README.md「6.2 参数表」。
# 改完用 `python3.10 capture/collect_cap.py --help` 核对最终默认值。

# ---------------------------------------------------------------- 手套
hand_port: auto          # 串口。auto = 按 USB VID:PID 28e9:018a 自动发现
hand_rate: 120           # 连续采集请求频率 Hz（1~300）；实测到货 115~118
cap_side: right           # 单只手套手别 left|right；决定相机命名与 Quest 默认手别

# ---------------------------------------------------------------- 相机
camera_mode: both        # both / cam0 / cam1 / none；none 不启动 ffmpeg
camera_0: auto           # auto 或 /dev/videoN
camera_1: auto           # 同上。两路填成同一个设备会互相抢占
camera_width: 1280       # 必须是设备支持的模式，否则 ffmpeg 起不来
camera_height: 720
camera_fps: 30
video_codec: copy        # copy 直通（CPU≈0）/ h264 / hevc / mjpeg

# ---------------------------------------------------------------- Quest
pose_source: controller  # controller / hand / head
pose_side: auto          # auto=跟随 cap_side；left/right 可显式覆盖
quest_rate: 120          # 主机轮询频率 Hz，不是头显推送频率
no_quest: false          # true = 只采手套与相机，quest 组写 NaN

# ---------------------------------------------------------------- 体积与视图
omit_distribution: false # true = 不写 10×119×3 分布力，体积降到几 MB/h
view: false              # 采集时开实时视图（只读内存，不碰 data.h5）；开了就带相机缩略图
view_mode: auto          # auto / html / tk；无显示器时选 html
view_fps: 20             # 只对 tk 模式生效，html 固定 150 ms 轮询
view_video_fps: 5        # 相机缩略图抽帧帧率，调高会多占 ffmpeg 的 CPU
view_video_width: 360    # 缩略图宽度，高度按比例
